<style>

<div id="root"></div>
<script>
  var M = window.Modern, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h(M.Row, { center: true }, h(M.Col, null, h(M.Box, null, "メタデータ"), h(M.Box, null, "画像")), h("span", { className: "arrow" }, "→"), h(M.Box, { variant: "dark" }, "単一モデル"), h("span", { className: "arrow" }, "→"), h(M.Col, null, h(M.Box, { variant: "light" }, "予測"), h(M.Box, { variant: "warn" }, "偏り"))));
