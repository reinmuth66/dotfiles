name: 'Update Claude Code'
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v23
      # Claude Code releases faster than the weekly update-flake.yaml, so only this input is updated daily.
      - name: Update nix-claude-code input
        id: update
        run: |
          nix flake update nix-claude-code
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Evaluation only, so the aarch64-darwin attribute can be read on the ubuntu runner.
          VERSION=$(nix eval --raw '.#darwinConfigurations.ReinmuthLaptop.pkgs.claude-code.version')
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::想定外のバージョン形式: ${VERSION}"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          # A PR created with GITHUB_TOKEN does not trigger pull_request workflows, so check.yaml would not run on it.
          token: ${{ secrets.CREATE_PR_TOKEN }}
          commit-message: 'chore: update claude-code to ${{ steps.update.outputs.version }}'
          title: 'chore: update claude-code to ${{ steps.update.outputs.version }}'
          body: |
            Automated update of the nix-claude-code input to Claude Code ${{ steps.update.outputs.version }}.
          branch: update/claude-code
          labels: dependencies
          delete-branch: true
      - name: Report failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          key: 'failure:update-claude-code'
