name: Update terminal-browser
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Check for new release
        id: check
        run: |
          # GitHub の Release は無い。インストール用のスクリプトが、最新の版と各成果物の sha256 を持つ
          SCRIPT=$(curl -fsSL https://terminal-browser.sh/install)
          LATEST=$(sed -n 's/^VERSION="v\([^"]*\)"$/\1/p' <<< "$SCRIPT" | head -1)
          CURRENT=$(grep -oP '(?<=version = ")[^"]+' pkgs/terminal-browser/default.nix || true)
          [[ "$LATEST" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::想定外の版の形式: ${LATEST}"; exit 1; }
          [[ "$CURRENT" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::pkgs/terminal-browser/default.nix から現在の版を取得できない"; exit 1; }
          SHA256=$(awk -v u="https://terminal-browser.sh/install/dl/stable/v${LATEST}/terminal-browser-darwin-arm64.tar.gz" '$2 == u { print $3 }' <<< "$SCRIPT" | head -1)
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::darwin-arm64 の sha256 を取り出せなかった"; exit 1; }
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update version and hash
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          HASH=$(nix hash convert --hash-algo sha256 --to sri "${{ steps.check.outputs.sha256 }}")
          [[ "$HASH" == sha256-* ]] || { echo "::error::hash を SRI に直せなかった"; exit 1; }
          F=pkgs/terminal-browser/default.nix
          sed -i "s/version = \"[^\"]*\"/version = \"${VERSION}\"/" "$F"
          sed -i "s|hash = \"[^\"]*\"|hash = \"${HASH}\"|" "$F"
          grep -q "version = \"${VERSION}\"" "$F" || { echo "::error::version を書き換えられなかった"; exit 1; }
          grep -qF "hash = \"${HASH}\"" "$F" || { echo "::error::hash を書き換えられなかった"; exit 1; }
          if git diff --quiet "$F"; then echo "::error::${F} を書き換えられなかった"; exit 1; fi
      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # A PR created with GITHUB_TOKEN does not trigger pull_request workflows, so check.yaml would not run on it.
          token: ${{ secrets.CREATE_PR_TOKEN }}
          commit-message: 'chore: update terminal-browser to ${{ steps.check.outputs.latest }}'
          title: 'chore: update terminal-browser to ${{ steps.check.outputs.latest }}'
          body: |
            Automated update of terminal-browser from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}.
          branch: update/terminal-browser
          labels: dependencies
          delete-branch: true
      - name: Report failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          key: 'failure:update-terminal-browser'
