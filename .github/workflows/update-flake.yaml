name: 'Update flake inputs'
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Update flake inputs
        run: nix flake update
      # vendorHash depends on go.sum, so the flake input alone cannot track it.
      # Even if this fails, the flake inputs PR is still created. The build error shows up at nh darwin switch.
      - name: Update pdf-cli vendorHash
        id: vendorhash
        continue-on-error: true
        run: |
          FAKE='sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          LOG=$(mktemp)
          sed -i "s|vendorHash = \"[^\"]*\"|vendorHash = \"${FAKE}\"|" pkgs/pdf-cli/default.nix
          nix build --no-link '.#pdf-cli.goModules' 2>&1 | tee "$LOG" || true
          HASH=$(grep -oE 'got:[[:space:]]+sha256-[A-Za-z0-9+/]+=*' "$LOG" | grep -oE 'sha256-.*' | head -1 || true)
          if [ -z "$HASH" ]; then
            git checkout pkgs/pdf-cli/default.nix
            echo "::warning::pdf-cli の vendorHash を取得できなかった"
            exit 1
          fi
          sed -i "s|vendorHash = \"[^\"]*\"|vendorHash = \"${HASH}\"|" pkgs/pdf-cli/default.nix
      - name: Report pdf-cli vendorHash failure
        if: steps.vendorhash.outcome == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          key: 'failure:update-flake:vendorhash'
          topic: 'pdf-cli の vendorHash'
          detail: >-
            pdf-cli の vendorHash を更新できませんでした。flake inputs の PR は作られていますが、
            そのままマージすると、switch のビルドが失敗します。pkgs/pdf-cli/default.nix の vendorHash を手動で更新してください。
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # A PR created with GITHUB_TOKEN does not trigger pull_request workflows, so check.yaml would not run on it.
          token: ${{ secrets.CREATE_PR_TOKEN }}
          commit-message: 'chore: update flake inputs'
          title: 'chore: update flake inputs'
          body: 'Automated flake inputs update by GitHub Actions.'
          branch: 'update/flake-inputs'
          labels: 'dependencies'
          delete-branch: true
      - name: Report failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          key: 'failure:update-flake'
