name: Update omnigraph
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag may or may not start with v/V. Widen the regex if tags can contain anything but digits and dots (-beta, -rc1, ...).
          LATEST=$(gh release view --repo ModernRelay/omnigraph --json tagName -q '.tagName')
          CURRENT=$(grep -oP '(?<=github:ModernRelay/omnigraph/)[Vv]?[0-9.]+' flake.nix || true)
          [[ "$LATEST" =~ ^[Vv]?[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::想定外のタグ形式: ${LATEST}"; exit 1; }
          [[ "$CURRENT" =~ ^[Vv]?[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::flake.nix から現在のタグを取得できない"; exit 1; }
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update tag and lock
        if: steps.check.outputs.needs_update == 'true'
        run: |
          sed -i -E "s|github:ModernRelay/omnigraph/[Vv]?[0-9.]+|github:ModernRelay/omnigraph/${{ steps.check.outputs.latest }}|" flake.nix
          nix flake update omnigraph
          if git diff --quiet flake.nix; then echo "::error::flake.nix のタグを書き換えられなかった"; exit 1; fi
          if git diff --quiet flake.lock; then echo "::error::flake.lock が更新されなかった"; exit 1; fi
      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # A PR created with GITHUB_TOKEN does not trigger pull_request workflows, so check.yaml would not run on it.
          token: ${{ secrets.CREATE_PR_TOKEN }}
          commit-message: 'chore: update omnigraph to ${{ steps.check.outputs.latest }}'
          title: 'chore: update omnigraph to ${{ steps.check.outputs.latest }}'
          body: |
            Automated update of omnigraph from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}.
          branch: update/omnigraph
          labels: dependencies
          delete-branch: true
      - name: Report failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          key: 'failure:update-omnigraph'
